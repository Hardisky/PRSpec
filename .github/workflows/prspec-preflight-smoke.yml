name: PRSpec diagnostic preflight
on:
  push:
    branches: [prspec-pilot-preflight-20261110]
    paths: [.github/workflows/prspec-preflight-smoke.yml]
permissions:
  actions: read
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Diagnose original failed run without exposing log contents
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'CODE'
          import json, os, re, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          runs = {'Hardisky/besu':'43122516246', 'Hardisky/PRSpec':'43122522120'}
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'User-Agent':'PRSpec-preflight'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as response:
                  return response.read(5000000)
          reason = 'no_matching_output'
          try:
              jobs=json.loads(get(f'https://api.github.com/repos/{repo}/actions/runs/{runs[repo]}/jobs'))['jobs']
              lines=get(f'https://api.github.com/repos/{repo}/actions/jobs/{jobs[0]["id"]}/logs').decode('utf-8', 'replace').splitlines()
              for line in lines:
                  m=re.match(r'^\d{4}-\d\d-\d\dT\S+Z (FAIL: .*)$', line)
                  if not m:
                      continue
                  msg=m.group(1)
                  if msg == 'FAIL: PRSPEC_META_API_KEY unavailable to this job': reason='secret_missing'
                  elif msg == 'FAIL: Meta returned no message content': reason='empty_response'
                  elif re.fullmatch(r'FAIL: Meta HTTP status (400|401|403|404|429|500|503)', msg): reason='http_'+msg.rsplit(' ',1)[-1]
                  elif msg.startswith('FAIL: Meta HTTP status '): reason='http_other'
                  elif msg.startswith('FAIL: Meta request error:'): reason='request_error'
          except Exception:
              reason='logs_unavailable'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('reason='+reason+'\n')
          print('Only a fixed diagnostic category is exposed.')
          CODE
      - name: Earlier failure secret_missing
        if: steps.logs.outputs.reason == 'secret_missing'
        run: echo Diagnostic category confirmed
      - name: Earlier failure empty_response
        if: steps.logs.outputs.reason == 'empty_response'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_400
        if: steps.logs.outputs.reason == 'http_400'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_401
        if: steps.logs.outputs.reason == 'http_401'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_403
        if: steps.logs.outputs.reason == 'http_403'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_404
        if: steps.logs.outputs.reason == 'http_404'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_429
        if: steps.logs.outputs.reason == 'http_429'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_500
        if: steps.logs.outputs.reason == 'http_500'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_503
        if: steps.logs.outputs.reason == 'http_503'
        run: echo Diagnostic category confirmed
      - name: Earlier failure http_other
        if: steps.logs.outputs.reason == 'http_other'
        run: echo Diagnostic category confirmed
      - name: Earlier failure request_error
        if: steps.logs.outputs.reason == 'request_error'
        run: echo Diagnostic category confirmed
      - name: Earlier failure no_matching_output
        if: steps.logs.outputs.reason == 'no_matching_output'
        run: echo Diagnostic category confirmed
      - name: Earlier failure logs_unavailable
        if: steps.logs.outputs.reason == 'logs_unavailable'
        run: echo Diagnostic category confirmed
